
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레트로 야구</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #18232e;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 24px 12px;
    }
    main {
      max-width: 520px;
      margin: auto;
      background: #263746;
      border: 3px solid #e8c66a;
      border-radius: 12px;
      padding: 20px;
    }
    h1 { color: #ffe18a; }
    button {
      padding: 12px 18px;
      margin: 6px;
      border: 0;
      border-radius: 8px;
      background: #e8c66a;
      font-weight: bold;
      font-size: 16px;
    }
    #message { min-height: 48px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>⚾ 레트로 야구</h1>
    <p>나만의 야구 게임 프로젝트</p>
    <p id="score">점수 0 | 스트라이크 0</p>
    <div id="message">플레이 버튼을 눌러 시작하이소!</div>
    <button id="play">플레이 볼!</button>
  </main>
  <script>
    let score = 0;
    let strikes = 0;

    document.getElementById("play").addEventListener("click", () => {
      const result = Math.random();

      if (result < 0.35) {
        score++;
        document.getElementById("message").textContent =
          "안타다! 점수 1점 추가!";
      } else if (result < 0.65) {
        strikes++;
        if (strikes >= 3) {
          strikes = 0;
          document.getElementById("message").textContent =
            "삼진 아웃! 다음 타자!";
        } else {
          document.getElementById("message").textContent =
            "스트라이크!";
        }
      } else {
        document.getElementById("message").textContent =
          "볼이다! 다음 공을 기다리자!";
      }

      document.getElementById("score").textContent =
        "점수 " + score + " | 스트라이크 " + strikes;
    });
  </script>
</body>
</html>
